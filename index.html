<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="RACHDA — Artisanat élégant & objets qui ont une âme. Céramique et pièces faites main." />
  <title>RACHDA — Artisanat Authentique</title>

  <!-- Logo en favicon (simple et efficace) -->
  <link rel="icon" type="image/png" href="logo-rachda.png">

  <style>
    :root{
      --bg:#0B0B0D;
      --surface: rgba(255,255,255,.04);
      --surface2: rgba(255,255,255,.06);
      --text:#F5F5F5;
      --muted: rgba(245,245,245,.72);
      --line: rgba(245,245,245,.14);
      --gold:#C9A24D;
      --gold2:#E2C679;
      --radius: 18px;
      --max: 1180px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(900px 520px at 15% 12%, rgba(201,162,77,.10), transparent 60%),
        radial-gradient(900px 520px at 85% 18%, rgba(226,198,121,.08), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a{color:inherit; text-decoration:none}
    img{max-width:100%; display:block}
    .container{max-width:var(--max); margin:0 auto; padding:0 18px}

    /* Top announcement bar */
    .bar{
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      color: var(--muted);
    }
    .bar .inner{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:10px 0;
    }
    .bar b{color: var(--gold2); font-weight:600}

    /* Header */
    header{
      position: sticky;
      top:0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(11,11,13,.72);
      backdrop-filter: blur(12px);
    }

    .nav{
      height: 78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 160px;
    }
    .brand img{
      height: 44px;
      width: auto;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }

    .navlinks{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .navlinks a, .drop > button{
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      cursor:pointer;
    }
    .navlinks a:hover, .drop > button:hover{
      color: var(--text);
      border-color: rgba(245,245,245,.12);
      background: rgba(255,255,255,.03);
    }

    /* Dropdown (CSS only) */
    .drop{position:relative}
    .menu{
      position:absolute;
      top: 46px;
      left: 0;
      min-width: 230px;
      background: rgba(11,11,13,.96);
      border:1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 10px;
      display:none;
    }
    .drop:focus-within .menu,
    .drop:hover .menu{display:block}
    .menu a{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:10px 10px;
      border-radius: 12px;
      color: var(--muted);
      text-transform:none;
      letter-spacing:0;
      font-size: 14px;
    }
    .menu a:hover{background: rgba(255,255,255,.04); color: var(--text)}
    .pill{
      font-size: 12px;
      color: rgba(11,11,13,.92);
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 650;
      white-space: nowrap;
    }

    .nav-right{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      min-width: 190px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 16px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      white-space: nowrap;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.05); border-color: rgba(245,245,245,.2)}
    .btn.gold{
      border-color: rgba(201,162,77,.55);
      background: linear-gradient(135deg, rgba(201,162,77,.28), rgba(226,198,121,.12));
    }

    /* Hero */
    .hero{
      padding: 34px 0 26px;
    }
    .hero-top{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      align-items:stretch;
      padding-top: 22px;
    }

    .hero h1{
      margin: 0 0 10px;
      font-size: clamp(34px, 4.2vw, 56px);
      line-height: 1.05;
      font-weight: 520;
      letter-spacing: -.02em;
    }
    .hero h1 .gold{color: var(--gold2)}
    .hero p{
      margin: 0 0 18px;
      color: var(--muted);
      max-width: 62ch;
      font-size: 16px;
    }

    .hero-cta{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      margin-top: 6px;
    }

    .feature{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: var(--shadow);
      position:relative;
    }
    .feature .media{
      height: 220px;
      background:
        radial-gradient(700px 320px at 20% 30%, rgba(201,162,77,.20), transparent 60%),
        radial-gradient(680px 340px at 80% 20%, rgba(226,198,121,.16), transparent 60%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    .placeholder{
      width: min(360px, 90%);
      border-radius: 16px;
      border: 1px dashed rgba(245,245,245,.26);
      background: rgba(0,0,0,.12);
      padding: 14px;
      text-align:center;
      color: var(--muted);
      font-size: 13px;
    }
    .feature .body{padding: 16px 16px 18px}
    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(0,0,0,.18);
      font-size: 12px;
    }
    .dot{width:7px;height:7px;border-radius:50%;background: var(--gold2)}
    .feature h3{margin: 10px 0 6px; font-size: 18px; font-weight: 600}
    .feature p{margin:0; color: var(--muted); font-size: 14px}

    .stats{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .stat{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 12px;
    }
    .stat b{display:block; font-size: 14px}
    .stat span{display:block; color: var(--muted); font-size: 12px}

    /* Sections */
    section{padding: 64px 0}
    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .title h2{
      margin:0;
      font-size: 26px;
      letter-spacing: -.01em;
      font-weight: 600;
    }
    .title p{
      margin:0;
      color: var(--muted);
      max-width: 70ch;
      font-size: 14px;
    }

    /* Inspiration tiles */
    .tiles{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .tile{
      border:1px solid var(--line);
      border-radius: var(--radius);
      overflow:hidden;
      background: rgba(255,255,255,.03);
    }
    .tile .img{
      height: 220px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
        radial-gradient(560px 260px at 25% 25%, rgba(201,162,77,.16), transparent 60%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
    }
    .tile .img span{color: var(--muted); font-size: 13px; text-align:center}
    .tile .txt{padding: 14px}
    .tile .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      color: var(--muted);
      border:1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999
